<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upgrade calculator · TripleTen ops</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FFD6C5'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' text-anchor='middle' fill='%231A1A1A'%3E%24%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF; --cream:#F2F1EE; --stone:#E3E1DE; --ink:#1A1A1A;
  --muted:rgba(0,0,0,.55); --faint:rgba(0,0,0,.38); --hair:rgba(0,0,0,.12);
  --peach:#FFD6C5; --peach-deep:#FF976B;
  --green:#2E8B50; --green-pale:#DDF3E4; --red:#C2453E; --red-pale:#FFDCD9;
  --r-card:24px; --r-tag:8px; --r-ctl:12px;
  --font:'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font:16px/1.45 var(--font);
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.wrap{max-width:1360px;margin:0 auto;padding:28px 28px 64px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{height:22px;width:auto}
h1{font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.05;letter-spacing:-.02em;margin:10px 0 0}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0;max-width:62ch}

.layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:28px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:1fr}}

/* ---------- student panel ---------- */
.panel{background:var(--cream);border-radius:var(--r-card);padding:24px}
.panel h2,.quote h2{font-weight:500;font-size:20px;margin:0 0 18px;letter-spacing:-.01em}
.field{margin:0 0 18px;border:0;padding:0;min-width:0}
.field>legend,.field>label{display:block;font-size:13px;color:var(--muted);margin:0 0 7px;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:var(--r-ctl);background:var(--white);
  cursor:pointer;font-size:14px;line-height:1.2;user-select:none;transition:background .12s}
.seg label small{color:var(--faint);font-size:12px}
.seg label:hover{background:var(--stone)}
.seg input:checked+label{background:var(--ink);color:var(--white)}
.seg input:checked+label small{color:rgba(255,255,255,.65)}
.seg input:focus-visible+label{outline:2px solid var(--ink);outline-offset:2px}
.seg input:disabled+label{opacity:.35;cursor:not-allowed;background:transparent}
.seg.fill label{flex:1;justify-content:center}
select,.money{width:100%;padding:10px 12px;border-radius:var(--r-ctl);border:0;background:var(--white);font-size:15px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.hint.warn{color:var(--red)}
.now{background:var(--white);border-radius:16px;padding:14px 16px;margin-top:6px}
.now .k{font-size:13px;color:var(--muted)}
.now .v{font-size:22px;letter-spacing:-.01em;margin-top:2px}
.now .d{font-size:13px;color:var(--muted);margin-top:2px}

.levels{margin-top:22px}
.levels h3{font-weight:500;font-size:14px;margin:0 0 8px}
.levels .tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--muted)}
th:first-child,td:first-child{text-align:left}
td .p{color:var(--faint);margin-left:4px}
td.cur{background:var(--peach);border-radius:6px}
td.na{color:var(--faint)}

/* ---------- quote ---------- */
.quote-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.quote-head h2{margin:0}
.cur-tag{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cards.four{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1200px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.cards{grid-template-columns:1fr}}
.card{background:var(--cream);border-radius:var(--r-card);padding:22px;display:flex;flex-direction:column;min-height:100%}
.card.first{background:var(--peach)}
.card.empty{background:transparent;outline:1.5px dashed var(--stone);outline-offset:-1.5px;color:var(--faint);justify-content:center;align-items:center;text-align:center;min-height:220px}
.rank{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;font-size:13px;padding:5px 10px;border-radius:var(--r-tag);background:var(--white)}
.rank b{font-weight:600}
.card h3{font-weight:400;font-size:26px;line-height:1.1;letter-spacing:-.02em;margin:14px 0 4px}
.card h3 .mode{display:block;font-size:17px;letter-spacing:-.01em;margin-top:4px}
.lvl{font-size:13px;color:var(--muted)}
.short{font-size:14.5px;margin:12px 0 0;max-width:46ch}
.short .split{display:block;margin-top:6px;color:var(--ink);font-weight:500}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:12.5px;padding:4px 9px;border-radius:var(--r-tag);background:var(--red-pale);color:#8A2B25}
.pay{margin-top:20px;padding-top:16px;border-top:1px solid var(--hair)}
.pay .k{font-size:13px;color:var(--muted)}
.pay .big{font-size:44px;line-height:1;letter-spacing:-.03em;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.then{font-size:15px}
.then b{font-weight:600}
.cmp{font-size:13px;color:var(--muted);margin-top:4px}
.tot{margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.tot .r{text-align:right}
.tot .was{color:var(--faint);text-decoration:line-through}
.tot .save{color:var(--green);font-weight:600}
.copy{margin-top:auto;padding-top:18px}
.copy button{width:100%;border:0;border-radius:var(--r-ctl);padding:11px 14px;background:var(--ink);color:var(--white);cursor:pointer;font-weight:500}
.card.first .copy button{background:var(--ink)}
.copy button:hover{background:#000}
.none{background:var(--cream);border-radius:var(--r-card);padding:28px}
.none h3{font-weight:400;font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
.none p{margin:0;color:var(--muted)}
.foot{margin-top:28px;font-size:12.5px;color:var(--faint);max-width:80ch}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--white);padding:10px 16px;border-radius:12px;font-size:14px;transition:all .18s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <h1>Upgrade calculator</h1>
      <p class="sub">Pick the student's situation. Quote offer 1 first and move to the next one only if the student says no.</p>
    </div>
  </header>

  <div class="layout">
    <section class="panel" aria-labelledby="student-h">
      <h2 id="student-h">The student</h2>

      <fieldset class="field"><legend>Country</legend><div class="seg" id="country"></div></fieldset>
      <fieldset class="field"><legend>Bought on</legend><div class="seg fill" id="list"></div></fieldset>
      <div class="field"><label for="course">Course</label><select id="course"></select></div>
      <fieldset class="field"><legend>Current plan</legend><div class="seg fill" id="plan"></div>
        <p class="hint" id="plan-hint" hidden></p></fieldset>
      <fieldset class="field"><legend>Current discount level</legend><div class="seg fill" id="level"></div></fieldset>
      <div class="field"><label for="pm">Payments already made</label><select id="pm"></select>
        <p class="hint" id="pm-hint"></p></div>
      <fieldset class="field"><legend>Student has graduated</legend><div class="seg fill" id="grad"></div>
        <p class="hint" id="grad-hint"></p></fieldset>
      <div class="field"><label for="paid">Total already paid</label>
        <input class="money" id="paid" inputmode="decimal" autocomplete="off">
        <p class="hint" id="paid-hint"></p></div>

      <div class="now" id="now"></div>

      <div class="levels">
        <h3>Discount levels for this course</h3>
        <div class="tbl"><table id="levels"></table></div>
      </div>
    </section>

    <section class="quote" aria-labelledby="quote-h" aria-live="polite">
      <div class="quote-head"><h2 id="quote-h">What to quote</h2><span class="cur-tag" id="cur-tag"></span></div>
      <div id="out"></div>
      <p class="foot" id="foot"></p>
    </section>
  </div>
</div>

yst":0.1,"Data Science":0.1,"QA":0.1,"UX/UI Designer":0.1,"Cyber Security":0.1},"countries":["Mexico","Chile","Ecuador","Peru","Colombia","Argentina"],"courses":["Web Developer","Data Analyst","Data Science","QA","UX/UI Designer","Cyber Security"]}</script>

<script>
/* ---------- pure calculation (kept free of DOM so it can be tested) ---------- */
const CALC = (function(){
  function planTable(p){
    const t = {Upfront:{l:[p.full,p.up1,p.up2,p.up3], full:p.full, n:1},
               Monthly:{l:[p.full,p.mon1,p.mon2,p.mon3], full:p.full, n:p.mon_n}};
    if (p.ext1 != null) t.Extended = {l:[p.full,p.ext1,p.ext2,p.ext3], full:p.full, n:p.ext_n};
    if (p.dep1 != null) t.Deposit  = {l:[p.dep_full,p.dep1,p.dep2,p.dep3], full:p.dep_full, n:p.dep_n};
    return t;
  }
  const r0 = x => Math.round(x);
  function pct(x){ return Math.round(x*100) + '%'; }

  function quote(D, s){
    // s = {country, list:'Old'|'New', course, plan, level, pm, paid (number|null)}
    const p = D.prices[`${s.country}|${s.list}|${s.course}`];
    if (!p) return {error:'No prices for this course'};
    const T = planTable(p), DEP = D.depositShare, cap = D.cap;
    const planOK = (s.country === 'Mexico' || s.plan === 'Monthly') && !!T[s.plan];
    if (!planOK) return {error:`${s.country} has only Monthly plans`, planOK:false, T, p};
    const curT = T[s.plan];
    const cur = curT.l[s.level];
    const curDisc = 1 - cur / curT.full;
    const nDep = T.Deposit ? T.Deposit.n : 0, nMon = T.Monthly.n;
    const inst = s.plan === 'Deposit' ? cur*(1-DEP)/(nDep-1) : cur / curT.n;
    const paidAuto = r0(s.plan === 'Deposit' ? DEP*cur + inst*(s.pm-1) : inst*s.pm);
    const paid = r0(s.paid == null ? paidAuto : s.paid);
    const block = (D.matrix[s.country] || {})[s.plan] || {};

    const rows = D.offers.map(o => {
      const H = s.level + o.step;
      const tT = T[o.target];
      const exists = (s.country === 'Mexico' || o.target === 'Upfront' || o.target === 'Monthly') && !!tT &&
        H >= 1 && H <= cap &&
        (o.applies !== 'Extended only' || s.plan === 'Extended') &&
        (o.applies !== 'Not for Monthly' || s.plan !== 'Monthly');
      const J = Math.max(0, Math.min(3, H));
      const K = tT ? tT.l[J] : 0;
      const disc = tT ? 1 - K / tT.full : 0;
      const same = o.target === s.plan && H === s.level;
      const N = cur - K, O = N / cur;
      const mv = (block[o.name] || {})[`${s.pm}-${s.level}`] ?? 'NO';
      const Tt = K - paid;
      const E = o.parts;
      const U = o.target === 'Upfront' ? r0(Math.max(0,Tt)/E) : o.target === 'Deposit' ? r0(DEP*K) : 0;
      const W = Math.max(0, Tt - U);
      const X = W <= 0 ? 0 : o.target === 'Upfront' ? E - 1 :
                o.target === 'Monthly' ? Math.max(1, nMon - s.pm) : Math.max(1, nDep - 1 - s.pm);
      const V = X === 0 ? 0 : o.target === 'Upfront' ? r0(Math.max(0,Tt)/E) : r0(W / X);
      const Y = X ? V : 0;
      const Z = X ? r0(W - V*(X-1)) : 0;
      const check = Tt >= U && r0(paid + U + W - K) === 0;
      const isPrio = typeof mv === 'number';
      const allowed = exists && !same && O >= 0.01 && (mv === 'YES' || isPrio) && check;
      return {o, exists, same, K, disc, N, O, mv, U, X, Y, Z, check, allowed, prio: isPrio ? mv : 99, level: J};
    });
    // early payoff / graduation payoff: discount on the remaining balance, plan and level stay the same
    const isNum = x => typeof x === 'number';
    const remaining = cur - paid;
    let payD = 'NO';
    if (s.pm >= 2 && s.pm <= 10) {
      const key = s.plan === 'Extended' ? `Extended · ${s.course}` : `${s.plan} (all courses)`;
      const ep = ((D.earlyPayoff || {})[s.country] || {})[key] || {};
      if (isNum(ep[String(s.pm)])) payD = ep[String(s.pm)];
    }
    const gradD = (s.graduated && s.country === 'Mexico' && s.plan === 'Extended' && isNum((D.graduation || {})[s.course])) ? D.graduation[s.course] : 'NO';
    const source = isNum(gradD) && (!isNum(payD) || gradD >= payD) ? 'Graduation' : isNum(payD) ? 'Payments' : '';
    if (source && s.pm < curT.n && remaining > 0) {
      const d = source === 'Graduation' ? gradD : payD;
      const U = r0(Math.max(0, remaining) * (1 - d));
      const K = paid + U;
      const money = n => '$' + Math.round(n).toLocaleString('en-US');
      const name = source === 'Graduation' ? 'Graduation payoff' : 'Early payoff';
      rows.push({o:{id:14, name, target:s.plan, parts:1, approval:'No', step:0}, payoff:true, source, d,
        K, N: cur - K, O: (cur - K) / cur, U, X:0, Y:0, Z:0, allowed:true, prio:50, level:s.level,
        title: `${name} −${pct(d)}`, mode: 'on the remaining balance', label: `${name} −${pct(d)} on the rest`,
        levelText: `Level ${s.level} — same level as now`,
        short: `Pay the remaining ${money(remaining)} today with ${pct(d)} off it. The plan and discount level stay the same.`,
        cadence: '', lastDiff: false});
    }
    const top = rows.filter(r => r.allowed && r.prio < 99).sort((a,b) => a.prio - b.prio || a.o.id - b.o.id).slice(0,4);
    const shown = new Set(top.map(r => r.o.id));
    const twin = {1:2, 5:6, 8:9};
    top.forEach(r => {
      if (r.payoff) return;
      const o = r.o;
      r.title = o.target + (r.disc > 0 ? ' −' + pct(r.disc) : ' (list price)');
      r.mode = o.target === 'Upfront' ? (o.parts === 1 ? 'pay in full' : `${o.parts} parts`) :
               o.target === 'Monthly' ? `${nMon}-month plan` : 'deposit + instalments';
      r.label = r.title + ' · ' + r.mode;
      r.levelText = `Level ${r.level} — ` + (o.step === 0 ? 'same level as now' : o.stepText.toLowerCase());
      r.short = o.target === 'Upfront'
        ? (o.parts === 1 ? `Pay the rest today in one payment at ${pct(r.disc)} off list.`
                         : `${pct(r.disc)} off list, paid in ${o.parts} parts: one today, ${o.parts === 2 ? 'the second' : 'the other ' + (o.parts-1)} within 7 days.`)
        : o.target === 'Monthly' ? `Switch to the ${nMon}-month plan at ${pct(r.disc)} off list. Nothing extra today.`
        : `${pct(DEP)} deposit today, the rest monthly, at ${pct(r.disc)} off list.`;
      const t = twin[o.id];
      if (t) {
        const tw = rows[t-1];
        if (tw.allowed && !shown.has(t)) r.splitNote = 'Can also be split into 2 or 3 parts: one today, the rest within 7 days.';
      }
      r.cadence = o.target === 'Upfront' ? 'within 7 days' : 'monthly';
      r.lastDiff = r.X > 1 && Math.abs(r.Z - r.Y) > 10;
    });
    return {planOK:true, T, p, cur, curDisc, inst, paidAuto, paid, rows, top, nMon, nDep, remaining, planN: curT.n};
  }
  return {quote, planTable};
})();
if (typeof module !== 'undefined') module.exports = CALC;
</script>

<script>
/* ---------- UI ---------- */
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const FLAG = {Mexico:'🇲🇽', Chile:'🇨🇱', Ecuador:'🇪🇨', Peru:'🇵🇪', Colombia:'🇨🇴', Argentina:'🇦🇷'};
  const LISTS = [['Old','Before 06.10.26'],['New','From 06.10.26']];
  const PLANS = ['Monthly','Extended','Deposit'];
  const $ = id => document.getElementById(id);
  const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
  const pct = x => Math.round(x*100) + '%';

  const state = {country:'Mexico', list:'Old', course:'Data Analyst', plan:'Extended', level:2, pm:1, paid:null, graduated:false};
  // restore from the link (#country=…&…) so a quote can be shared with a lead
  try {
    const h = new URLSearchParams(location.hash.slice(1));
    for (const k of ['country','list','course','plan']) if (h.get(k)) state[k] = h.get(k);
    for (const k of ['level','pm']) if (h.get(k)) state[k] = +h.get(k);
    if (h.get('paid')) state.paid = +h.get('paid');
    state.graduated = h.get('grad') === '1';
  } catch(e) {}
  if (!D.countries.includes(state.country)) state.country = 'Mexico';
  if (!D.courses.includes(state.course)) state.course = 'Data Analyst';

  function seg(el, name, items, value, onPick){
    el.innerHTML = '';
    items.forEach(([v, html, disabled], i) => {
      const id = `${name}-${i}`;
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = name; inp.id = id; inp.value = v;
      inp.checked = String(v) === String(value); inp.disabled = !!disabled;
      inp.addEventListener('change', () => onPick(v));
      const lab = document.createElement('label'); lab.htmlFor = id; lab.innerHTML = html;
      el.append(inp, lab);
    });
  }
  function set(k, v){ state[k] = v; if (['country','list','course','plan','pm'].includes(k)) { state.paid = null; $('paid').value = ''; } render(); }

  $('course').innerHTML = D.courses.map(c => `<option>${c}</option>`).join('');
  $('course').addEventListener('change', e => set('course', e.target.value));
  $('pm').addEventListener('change', e => set('pm', +e.target.value));
  $('paid').addEventListener('input', e => {
    const v = e.target.value.replace(/[^0-9.]/g,'');
    state.paid = v === '' ? null : +v; render(false);
  });

  function render(rebuildInputs = true){
    if (!(state.country === 'Mexico') && state.plan !== 'Monthly') state.plan = 'Monthly';
    const q = CALC.quote(D, state);
    const cur = q.p ? q.p.cur : '';

    if (rebuildInputs) {
      seg($('country'), 'country', D.countries.map(c => [c, `<span aria-hidden="true">${FLAG[c]}</span>${c}`]), state.country, v => set('country', v));
      seg($('list'), 'list', LISTS.map(([v,l]) => [v, l]), state.list, v => set('list', v));
      $('course').value = state.course;
      seg($('plan'), 'plan', PLANS.map(p => [p, p, state.country !== 'Mexico' && p !== 'Monthly']), state.plan, v => set('plan', v));
      const T = q.T || CALC.planTable(D.prices[`${state.country}|${state.list}|${state.course}`]);
      const pt = T[state.plan];
      seg($('level'), 'level', [1,2,3].map(l => [l, `${l} <small>−${pct(1 - pt.l[l]/pt.full)}</small>`]), state.level, v => set('level', +v));
      const maxPm = Math.max(1, pt.n);
      if (state.pm > maxPm) state.pm = maxPm;
      $('pm').innerHTML = Array.from({length:maxPm}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('');
      $('pm').value = String(state.pm);
      const gradOK = state.country === 'Mexico' && state.plan === 'Extended';
      if (!gradOK) state.graduated = false;
      seg($('grad'), 'grad', [[0,'No'],[1,'Yes', !gradOK]], state.graduated ? 1 : 0, v => set('graduated', !!+v));
    }
    {
      const T0 = q.T || {}; const n0 = T0[state.plan] ? T0[state.plan].n : 0;
      $('pm-hint').textContent = state.pm >= n0 ? `All ${n0} payments made — the plan is fully paid.`
        : `Plan has ${n0} payments` + (state.pm > 3 ? '. After 3 payments only early payoff can apply.' : '.');
      $('grad-hint').textContent = state.country === 'Mexico' && state.plan === 'Extended'
        ? 'Finished the course, at any payment. Unlocks the graduation payoff.'
        : 'Graduation payoff exists only for Extended (Mexico).';
    }
    const ph = $('plan-hint');
    ph.hidden = state.country === 'Mexico';
    ph.textContent = `${state.country} sells Monthly and Upfront only — no Extended or Deposit.`;

    if (q.error) { $('out').innerHTML = `<div class="none"><h3>${q.error}</h3><p>Pick Monthly.</p></div>`; return; }

    $('paid').placeholder = `auto: ${fmt(q.paidAuto)}`;
    $('paid-hint').textContent = state.paid == null
      ? (state.plan === 'Deposit'
          ? `Using deposit ${fmt(D.depositShare * q.cur)}` + (state.pm > 1 ? ` + ${state.pm-1} × ${fmt(q.inst)}` : '') + '. Type a total only if it differs.'
          : `Using ${state.pm} × ${fmt(q.inst)}. Type a total only if it differs.`)
      : `Using ${fmt(q.paid)} instead of the auto ${fmt(q.paidAuto)}.`;

    $('now').innerHTML = `<div class="k">Pays now</div>
      <div class="v">${fmt(q.cur)} total</div>
      <div class="d">${q.curDisc > 0 ? pct(q.curDisc) + ' off list' : 'List price'}, ${fmt(q.inst)} a month${state.plan === 'Deposit' ? ' after the deposit' : ''}</div>`;

    // discount level table
    const rowsT = ['Upfront','Monthly','Extended','Deposit'].filter(k => q.T[k]);
    $('levels').innerHTML = `<thead><tr><th>Plan</th><th>Level 1</th><th>Level 2</th><th>Level 3</th></tr></thead><tbody>` +
      rowsT.map(k => `<tr><td>${k}</td>` + [1,2,3].map(l => {
        const t = q.T[k], isCur = k === state.plan && l === state.level;
        return `<td class="${isCur ? 'cur' : ''}">${fmt(t.l[l])}<span class="p">−${pct(1 - t.l[l]/t.full)}</span></td>`;
      }).join('') + `</tr>`).join('') + `</tbody>`;

    $('cur-tag').textContent = `Amounts in ${cur} · ${state.list === 'Old' ? 'prices before 06.10.26' : 'prices from 06.10.26'}`;

    // offers
    const when = ['Start here','If 1 is declined','If 2 is declined','Last try'];
    if (!q.top.length) {
      $('out').innerHTML = q.remaining > 0
        ? `<div class="none"><h3>No upsell offer</h3><p>The student can stay on the current plan, or pay off the remaining <b>${fmt(q.remaining)}</b> today without a discount.</p></div>`
        : `<div class="none"><h3>No upsell offer</h3><p>Nothing left to pay on the current plan.</p></div>`;
    } else {
      const cards = q.top.map((r, i) => {
        let then;
        if (r.X === 0) then = 'Nothing more to pay';
        else if (!r.lastDiff) then = `then <b>${r.X} × ${fmt(r.Y)}</b> ${r.cadence}`;
        else then = `then <b>${r.X - 1} × ${fmt(r.Y)}</b> + last <b>${fmt(r.Z)}</b> ${r.cadence}`;
        return `<article class="card ${i===0?'first':''}">
          <span class="rank"><b>${i+1}</b>${i === q.top.length - 1 && i > 0 ? 'Last try' : when[i]}</span>
          <h3>${r.title}<span class="mode">${r.mode}</span></h3>
          <div class="lvl">${r.levelText}</div>
          <p class="short">${r.short}${r.splitNote ? `<span class="split">${r.splitNote}</span>` : ''}</p>
          ${r.o.approval === 'Yes' ? '<div class="tags"><span class="tag">Needs lead approval</span></div>' : ''}
          <div class="pay">
            <div class="k">Pay now</div>
            <div class="big">${fmt(r.U)}</div>
            <div class="then">${then}</div>
            ${r.X > 0 ? `<div class="cmp">Pays ${fmt(q.inst)} a month now</div>` : ''}
          </div>
          <div class="tot">
            <span>New total</span><span class="r"><b>${fmt(r.K)}</b></span>
            <span>Current total</span><span class="r was">${fmt(q.cur)}</span>
            <span>Student saves</span><span class="r save">${fmt(r.N)} · ${pct(r.O)}</span>
          </div>
          <div class="copy"><button type="button" data-i="${i}">Copy quote</button></div>
        </article>`;
      });
      $('out').innerHTML = `<div class="cards${q.top.length > 3 ? ' four' : ''}">${cards.join('')}</div>`;
      $('out').querySelectorAll('.copy button').forEach(b => b.addEventListener('click', () => copyQuote(q.top[+b.dataset.i], q, cur)));
    }
    $('foot').textContent = 'Offer order comes from the matrix per country. Amounts are rounded to whole units; the last payment absorbs the difference.';

    // keep the link in sync so it can be shared
    const h = new URLSearchParams({country:state.country, list:state.list, course:state.course, plan:state.plan, level:state.level, pm:state.pm});
    if (state.paid != null) h.set('paid', state.paid);
    if (state.graduated) h.set('grad', '1');
    history.replaceState(null, '', '#' + h.toString());
  }

  function copyQuote(r, q, cur){
    const m = v => `${fmt(v)} ${cur}`;
    const lines = [
      'Student email: ',
      `Country: ${state.country}`,
      `Bought on: ${state.list === 'Old' ? 'Before 06.10.26' : 'From 06.10.26'}`,
      `Course: ${state.course}`,
      `Current plan: ${state.plan}`,
      `Current discount level: ${state.level} (${q.curDisc > 0 ? '−' + pct(q.curDisc) : 'list price'})`,
      `Payments already made: ${state.pm}`,
      `Student has graduated: ${state.graduated ? 'Yes' : 'No'}`,
      `Total already paid: ${m(q.paid)}`,
      `Upsell offer: ${r.label}`,
      `New student price: ${m(r.K)}`,
      `Old student price: ${m(q.cur)}`,
      `Savings: ${m(r.N)} (${pct(r.O)})`,
      `Pay now: ${m(r.U)}`,
    ];
    const txt = lines.join('\n');
    const done = () => toast('Quote copied');
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fallback(txt, done));
    else fallback(txt, done);
  }
  function fallback(txt, done){
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.append(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e) {} ta.remove();
  }
  let tt; function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1600); }

  if (state.paid != null) $('paid').value = state.paid;
  render();
  window.addEventListener('hashchange', () => location.reload());
})();
</script>
</body>
</html>
